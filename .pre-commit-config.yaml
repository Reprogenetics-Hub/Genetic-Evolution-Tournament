default_install_hook_types: ["pre-commit", "commit-msg"]
default_stages: ["pre-commit"]
ci:
  autofix_commit_msg: |
    chore(pre-commit): auto-fix pre-commit hook failings; for more
    information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore(pre-commit): run pre-commit autoupdate"
  autoupdate_schedule: monthly
  skip: []
  submodules: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys", "--indent", "4"]
      - id: trailing-whitespace
      - id: check-executables-have-shebangs
        files: \.sh$
      - id: detect-private-key
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: ["--force-exclude"]
        stages: ["pre-commit", "commit-msg"]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: ["commit-msg"]
        args: ["--strict", "--force-scope", "feat", "fix", "chore", "test", "custom"]
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: ["--no-schema"]
